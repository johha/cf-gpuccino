# BOSH deployment manifest excerpt – GPU cell instance group
#
# This fragment is meant to be merged into a full cf-deployment manifest.
# It defines a dedicated instance group for Diego cells that carry GPU devices.
# On AWS these would be p3.xlarge (1x Tesla V100) or p3.8xlarge (4x Tesla V100).
#
# Usage:
#   bosh deploy cf-deployment.yml \
#     -o gpu-cell.yml \
#     -v gpu_cell_count=2

instance_groups:
  - name: gpu-cell
    instances: 1
    vm_type: gpu            # e.g. p3.xlarge on AWS; g4dn.xlarge for T4
    stemcell: default
    azs: [z1]
    networks:
      - name: default

    # placement_tags allows the CF scheduler to target GPU cells.
    # Developers use `cf set-label app myapp gpu=true` combined with
    # placement constraints, or the auctioneer uses GPUCapacity scoring.
    env:
      bosh:
        agent:
          settings:
            tags:
              - gpu

    jobs:
      - name: rep
        release: diego
        properties:
          diego:
            rep:
              placement_tags: [gpu]
              evacuation_timeout_in_seconds: 60

      - name: executor
        release: diego
        properties:
          diego:
            executor:
              # Path where CDI spec files are stored on the cell.
              # garden-runc reads this directory at container creation time.
              cdi_spec_dirs: [/var/vcap/data/cdi/specs]

      - name: garden
        release: garden-runc
        properties:
          garden:
            # Pass CDI spec directories to garden-runc so it can resolve
            # CDI device names when creating containers.
            additional_args:
              - --cdi-spec-dirs=/var/vcap/data/cdi/specs

      - name: nvidia-toolkit
        release: cf-gpuccino
        properties:
          nvidia_toolkit:
            cdi_enabled: true
            cdi_spec_dir: /var/vcap/data/cdi/specs
            # Path to the nvidia-container-toolkit config.
            toolkit_config_path: /var/vcap/jobs/nvidia-toolkit/etc/nvidia-container-toolkit/config.toml
